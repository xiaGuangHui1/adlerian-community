server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 50
      min-spare: 5
    max-connections: 500
    accept-count: 50
  error:
    include-message: always
    include-exception: true

spring:
  application:
    name: adlerian-community

  datasource:
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:5432}/postgres?sslmode=require&prepareThreshold=0&gssEncMode=disable
    driver-class-name: org.postgresql.Driver
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5

  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

supabase:
  url: ${SUPABASE_URL}
  anon-key: ${SUPABASE_ANON_KEY}
  jwt-secret: ${SUPABASE_JWT_SECRET}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:https://www.adlerian.com.cn}
