server:
  port: ${PORT:8080}

spring:
  application:
    name: adlerian-community

  # 开发环境使用H2内存数据库，生产环境切换到Supabase PostgreSQL
  profiles:
    active: dev

  datasource:
    url: jdbc:h2:mem:adlerian;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

# Supabase配置（生产环境请替换为真实值）
supabase:
  url: ${SUPABASE_URL:}
  anon-key: ${SUPABASE_ANON_KEY:}
  jwt-secret: ${SUPABASE_JWT_SECRET:}

# CORS配置
app:
  cors:
    allowed-origins: http://localhost:5173
